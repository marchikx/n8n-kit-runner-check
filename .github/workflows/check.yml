name: python-runner-check

on:
  workflow_dispatch:

jobs:
  before:
    name: baseline (upstream compose, no sidecar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: take upstream compose and env
        run: |
          curl -sSL -o docker-compose.yml https://raw.githubusercontent.com/n8n-io/self-hosted-ai-starter-kit/main/docker-compose.yml
          curl -sSL -o .env https://raw.githubusercontent.com/n8n-io/self-hosted-ai-starter-kit/main/.env.example
      - run: docker compose up -d n8n
      - run: docker compose exec -T n8n sh -c 'cat /home/node/.n8n/../../usr/local/lib/node_modules/n8n/package.json 2>/dev/null | head -3' || true
      - name: python code node
        run: bash ci/run-check.sh
      - name: n8n logs
        if: always()
        run: docker logs n8n 2>&1 | tail -25

  after:
    name: patched (runner sidecar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d n8n n8n-runners
      - name: python code node
        run: bash ci/run-check.sh
      - name: runner logs
        if: always()
        run: docker logs n8n-runners 2>&1 | tail -25
      - name: n8n logs
        if: always()
        run: docker logs n8n 2>&1 | tail -25
